name: Publish World Memory v0.14.1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-world-memory-v0.14.1.yml"

permissions:
  contents: write

env:
  RELEASE_SOURCE_SHA: 259da538f8de553bbfd58f98a90e86af9a3750fe
  RELEASE_TAG: v0.14.1
  RELEASE_ASSET: world-memory-autopilot-v0.14.1.zip
  RELEASE_SHA256: e37bdfb9c077d1903947a086d2a32bcdbf0dc80ff1ae2a950c4e13a263cca8a0
  RELEASE_NOTES: |
    - Restores bounded direct HTTP collection for the five fixed RSS.app CSV feeds.
    - Applies timestamp offsets, half-open report-window filtering, URL deduplication, and per-source freshness diagnostics in deterministic code.
    - Preserves Walter Bloomberg rows whose Title is empty by using a nonempty normalized Description.
    - Keeps general web research available after feed collection for verification and enrichment without letting it replace RSS transport or alter feed status.
    - Adds regression coverage for direct transport, window boundaries, partial and total failures, empty-title rows, and the scheduled prompt contract.

jobs:
  publish:
    if: github.event.head_commit.message == 'release: publish v0.14.1'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact release source
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$RELEASE_SOURCE_SHA"
          git checkout --detach FETCH_HEAD

      - name: Verify source and build deterministic archive
        run: |
          set -euo pipefail
          PYTHONPATH=.:world-memory-autopilot/scripts python3 -m unittest tests.test_release_builder -v
          (
            cd world-memory-autopilot
            PYTHONPATH=scripts python3 -m unittest discover -s tests -v
          )
          python3 scripts/build_world_memory_release.py
          printf '%s  %s\n' "$RELEASE_SHA256" "$RELEASE_ASSET" | sha256sum -c -

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" "$RELEASE_ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SOURCE_SHA" \
            --title "World Memory Autopilot v0.14.1" \
            --latest \
            --notes "$RELEASE_NOTES"
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,url,isDraft,isPrerelease,targetCommitish,assets
