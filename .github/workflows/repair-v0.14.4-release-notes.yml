name: Repair World Memory Autopilot v0.14.4 release notes

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: write
  pull-requests: write

jobs:
  repair:
    if: github.repository == 'devninjadev/WorldMemoryLite' && github.head_ref == 'release-v0.14.4-notes'
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: 5a10abc52745158e4cd666c0d63a755de582e218
      TAG: v0.14.4
      ASSET: world-memory-autopilot-v0.14.4.zip
      EXPECTED_SIZE: "100625"
      WORKFLOW_PATH: .github/workflows/repair-v0.14.4-release-notes.yml
    steps:
      - name: Download and verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --pattern SHA256SUMS.txt
          test "$(stat -c %s "$ASSET")" = "$EXPECTED_SIZE"
          sha256sum --check SHA256SUMS.txt
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)" = "$SOURCE_SHA"

      - name: Rewrite release notes safely
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          asset = Path(os.environ["ASSET"])
          digest = hashlib.sha256(asset.read_bytes()).hexdigest()
          source = os.environ["SOURCE_SHA"]
          size = asset.stat().st_size
          notes = f"""Page large RSS collection results without repeating network collection.

          - Collect the eight configured RSS.app feeds exactly once per report window.
          - Store continuation pages in a short-lived invocation-local snapshot.
          - Read byte-bounded pages with `read-feed-page` and preserve item order.
          - Require the accumulated item count to match `itemCount` before any Notion write.
          - Expire temporary snapshots after 24 hours; never persist them to Notion or model evidence.
          - Add regression coverage for 259 long-summary items and the 345-minute integration threshold.

          Source commit: `{source}`
          ZIP size: `{size} bytes`
          SHA-256: `{digest}`
          """
          Path("release-notes.md").write_text(notes, encoding="utf-8")
          print(digest)
          PY
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md

      - name: Remove one-time repair machinery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          FILE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/$WORKFLOW_PATH?ref=main" --jq .sha)"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$WORKFLOW_PATH"             -f message="chore: remove one-time v0.14.4 release-note repair workflow"             -f sha="$FILE_SHA"             -f branch=main
          gh pr close "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --delete-branch
