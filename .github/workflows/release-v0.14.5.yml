name: Release v0.14.5

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v0.14.5.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build deterministic release archive
        run: |
          python scripts/build_world_memory_release.py
          sha256sum world-memory-autopilot-v0.14.5.zip > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          Add the Korean UI display name `월드메모리` while keeping the internal skill identifier `world-memory-autopilot`.

          - Show `월드메모리` in ChatGPT and Codex skill selectors.
          - Preserve the English internal invocation identity.
          - Include the deterministic installable ZIP and SHA-256 checksum.
          EOF
          printf '\nSource commit: `%s`\n' "$GITHUB_SHA" >> RELEASE_NOTES.md
          gh release create v0.14.5 \
            world-memory-autopilot-v0.14.5.zip \
            SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "World Memory Autopilot v0.14.5" \
            --notes-file RELEASE_NOTES.md
